version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type: { type: string, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { type: float64, pointer: true }
          # json.RawMessage (not []byte) so pgx sends jsonb as JSON text in every
          # query exec mode, including "exec" used behind poolers without prepared statements.
          - db_type: jsonb
            go_type: { import: encoding/json, type: RawMessage }
          - db_type: jsonb
            nullable: true
            go_type: { import: encoding/json, type: RawMessage }
